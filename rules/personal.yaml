# Personal rules — derived from 8100 prompts on the Hetzner server.
# Takes precedence over default.yaml and auto.yaml.
# Checked in order: force_low → explicit_high → explicit_low → high → low

clean:
  strip_patterns:
    - '\[[Pp]asted\s+text[^\]]*\]'   # strip pasted-content markers before classifying

force_low:
  patterns:
    # Slash commands — always UI navigation, never need thinking
    - '^\s*/\w'
    # Single-word confirmations (EN + NL)
    - '^(yes|no|ok|ja|nee|hi|hello|thanks|danke|sure|yep|nope|correct|great|perfect|fine|done|go|continue|works|exit|check|update|now|still)\s*[.!?,]?\s*$'
    # Option selections (1 / 2 / 3 / a / b / c)
    - '^[1-9abc]\s*$'
    - '^(do\s+)?[1-9]\s+(and\s+[1-9])?\s*$'
    - '^all\s+[1-9]\s*$'
    # Status ping patterns
    - '\bstill\s+(working|there)\s*\??\s*$'
    - '\bnow\s*\?+\s*$'
    - '\bstatus\s*\?+\s*$'
    - '\bcheck\s+again\s*$'

explicit:
  high:
    # Explicit user markers (inherited from default, listed here for safety)
    - '\bultrathink\b'
    - '\(\s*high\s+thinking\s*\)'
    - '\bthink\s+(hard|harder|deeper|a\s+lot)\b'
    # Bug investigation — very strong signals
    - '\bnot\s+work(ing)?\b'
    - '\bdoesn''?t\s+work\b'
    - '\bwon''?t\s+work\b'
    - '\bwhat''?s\s+wrong\b'
    - '\bwhat\s+is\s+wrong\b'
    - '\bnot\s+working\b'
    # How-to questions — need reasoning
    - '\bhow\s+do\s+i\b'
    - '\bhow\s+should\s+i\b'
    - '\bhow\s+can\s+i\b'
  low:
    - '\(\s*(?:no|low|minimal)\s+thinking\s*\)'

high:
  # Debugging & investigation
  - '\bdebug\b'
  - '\binvestigate\b'
  - '\broot[\s-]?cause\b'
  - "why\\s+(?:is|does|won'?t|isn'?t|doesn'?t|are|don'?t|did|didn'?t)\\b"
  - '\berror\b'
  - '\bexception\b'
  - '\bcrash(ing|ed)?\b'
  - '\bbroken\b'
  - '\bfailing\b'
  - '\bfix\s+the\b'
  - '\bfix\s+this\b'
  # Design & architecture
  - '\bdesign\b'
  - '\b(architect|architecture)\b'
  - '\bplan\s+(the|a|out)\b'
  - '\bbrainstorm\b'
  - '\btrade[\s-]?off\b'
  - '\bstrategy\b'
  - '\bapproach\b'
  # Complex implementation
  - '\bimplement\b'
  - '\brefactor\b'
  - '\bmigrate\b'
  - '\brewrite\b'
  - '\bset\s*up\b'
  - '\bdeploy\b'
  - '\binstall\b'
  # Security
  - '\bsecurity[\s-]?review\b'
  - '\bvulnerability\b'
  - '\baudit\b'
  # Performance
  - '\boptimize\b'
  - '\bperformance\b'
  - '\bslow\b'
  - '\bmemory\s+leak\b'
  # Review / explanation requests
  - '\bexplain\s+(why|how|what)\b'
  - '\bwhat\s+does\s+this\s+do\b'

low:
  # File/content lookups
  - '\brename\b'
  - '\bshow\b'
  - '\bcat\b'
  - '\blist\b'
  - '\bls\b'
  - '\bread\b'
  - '\bdisplay\b'
  - '\bprint\b'
  - '\bformat\b'
  - '\bprettify\b'
  # Simple questions
  - 'what\s+is\b'
  - 'where\s+is\b'
  - 'when\s+did\b'
  - '\bwhich\s+\w+\s+(is|are|does|do)\b'
  # Status checks
  - '\bstatus\b'
  - '\bversion\b'
  - '\brun\b'
  - '\bex(?:ec|ecute)\b'
  - 'check\s+if\b'
  - 'does\s+\w+\s+exist\b'
  # Dutch low-effort words
  - '^\s*ja\b'
  - '^\s*nee\b'
  - '^\s*lees\b'
  # Pasted-content-only (no instruction after stripping marker)
  - '^\s*$'
